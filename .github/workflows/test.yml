name: Run Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest -v
