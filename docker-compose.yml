services:
  main:
    image: "mkal/calvie:latest"
    restart: unless-stopped
    user: "${CALVIE_UID:-10001}:${CALVIE_GID:-10001}"
    group_add: ["${CALVIE_SOCKET_GID:-33}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    volumes:
      - type: bind
        source: ./sockets
        target: /sockets
        bind:
          create_host_path: false
      - type: bind
        source: ./config.ini
        target: /app/config.ini
        read_only: true
        bind:
          create_host_path: false
    command: [uvicorn, "main:app", --uds, /sockets/main.sock, --proxy-headers, "--forwarded-allow-ips=*"]

  backup:
    profiles: ["upgrade"]
    image: "mkal/calvie:latest"
    restart: unless-stopped
    user: "${CALVIE_UID:-10001}:${CALVIE_GID:-10001}"
    group_add: ["${CALVIE_SOCKET_GID:-33}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    volumes:
      - type: bind
        source: ./sockets
        target: /sockets
        bind:
          create_host_path: false
      - type: bind
        source: ./config.ini
        target: /app/config.ini
        read_only: true
        bind:
          create_host_path: false
    command: [uvicorn, "main:app", --uds, /sockets/backup.sock, --proxy-headers, "--forwarded-allow-ips=*"]

