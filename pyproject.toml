[project]
name = "calvie"
version = "0.1.8"
description = "Simple ical viewer"
authors = [{name = "Marek Kaleta", email = "mk@m1k.cz"}]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.53.0,<0.54",
    "starlette>=1.6.0,<2",
    "icalevents>=0.3.1,<0.4",
    "jinja2>=3.1.6,<4",
    "babel>=2.18.0,<3",
    "pytz>=2026.3.post1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx2>=2.13.0,<3",
]

[tool.uv]
package = false
