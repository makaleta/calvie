[project]
name = "calvie"
version = "0.1.7"
description = "Simple ical viewer"
authors = [{name = "Marek Kaleta", email = "mk@m1k.cz"}]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi>=0.137.2,<0.138",
    "uvicorn>=0.49.0,<0.50",
    "starlette>=1.3.1,<2",
    "icalevents>=0.3.1,<0.4",
    "jinja2>=3.1.6,<4",
    "babel>=2.18.0,<3",
    "pytz>=2026.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.1,<0.29",
]

[tool.uv]
package = false
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.14.0",
    "babel==2.18.0",
    "certifi==2026.6.17",
    "click==8.4.1",
    "colorama==0.4.6",
    "fastapi==0.137.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "icalendar==7.1.3",
    "icalevents==0.3.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.2",
    "six==1.17.0",
    "starlette==1.3.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.2",
    "urllib3==2.7.0",
    "uvicorn==0.49.0",
